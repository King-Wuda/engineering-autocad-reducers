[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-scan"
version = "0.1.0"
description = "Read a P&ID PDF with Claude and report every component, loop and stream on it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pymupdf>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
pid-scan = "pid_scan.cli:main"

[tool.setuptools]
packages = ["pid_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
